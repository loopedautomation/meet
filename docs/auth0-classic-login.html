<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in · looped</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <style>
    /* looped brand tokens — mirrors the product theme (themes.css):
       primary oklch(58% .22 280), dark bases at hue 270. */
    :root {
      --primary: #7b5cf5;
      --primary-soft: rgba(123, 92, 245, 0.35);
      --bg: #131318;
      --panel: #1a1a21;
      --text: #fafafa;
      --muted: rgba(250, 250, 250, 0.55);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
    }

    /* Left: brand panel */
    .brand {
      flex: 1 1 45%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px;
      background:
        radial-gradient(1200px 600px at -10% 110%, var(--primary-soft), transparent 60%),
        var(--panel);
      border-right: 1px solid rgba(250, 250, 250, 0.06);
    }
    .wordmark {
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.02em;
    }
    .wordmark .dot { color: var(--primary); }
    .pitch h1 {
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.1;
      letter-spacing: -0.03em;
      margin: 0 0 16px;
      font-weight: 650;
      text-wrap: balance;
    }
    .pitch p { color: var(--muted); font-size: 16px; max-width: 42ch; margin: 0; }
    .foot { color: var(--muted); font-size: 13px; }
    .foot a { color: inherit; }

    /* Right: the Lock widget, inline */
    .auth {
      flex: 1 1 55%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    #lock-container { width: 100%; max-width: 400px; }

    /* Blend Lock's card into the dark page: keep its light form (safe),
       square the corners toward the product's brutalist buttons, drop the
       default Auth0 badge chrome. */
    .auth0-lock.auth0-lock .auth0-lock-widget { box-shadow: 0 24px 80px rgba(0, 0, 0, 0.55); }
    .auth0-lock.auth0-lock .auth0-lock-header { display: none; }
    .auth0-lock.auth0-lock .auth0-lock-cred-pane { border-radius: 14px; }
    .auth0-lock.auth0-lock .auth0-lock-submit { border-radius: 0 0 14px 14px; }

    @media (max-width: 820px) {
      body { flex-direction: column; }
      .brand {
        flex: none;
        padding: 24px;
        border-right: none;
        border-bottom: 1px solid rgba(250, 250, 250, 0.06);
      }
      .pitch, .foot { display: none; }
    }
  </style>
</head>
<body>
  <aside class="brand">
    <div class="wordmark">looped<span class="dot">.</span></div>
    <div class="pitch">
      <h1>Your team, your agents, your&nbsp;server.</h1>
      <p>One login for everything looped — meetings, channels, and AI teammates on infrastructure you own.</p>
    </div>
    <div class="foot">looped.sh</div>
  </aside>

  <main class="auth">
    <div id="lock-container"></div>
  </main>

  <script src="https://cdn.auth0.com/js/lock/14.2.3/lock.min.js"></script>
  <script>
    // Decode utf8 characters properly
    var config = JSON.parse(decodeURIComponent(escape(window.atob('@@config@@'))));
    config.extraParams = config.extraParams || {};
    var connection = config.connection;
    var prompt = config.prompt;
    var languageDictionary;
    var language;

    if (config.dict && config.dict.signin && config.dict.signin.title) {
      languageDictionary = { title: config.dict.signin.title };
    } else if (typeof config.dict === 'string') {
      language = config.dict;
    }
    // The page carries the brand; the widget just says what to do.
    languageDictionary = languageDictionary || { title: 'Welcome back' };
    var loginHint = config.extraParams.login_hint;
    var colors = config.colors || {};

    var lock = new Auth0Lock(config.clientID, config.auth0Domain, {
      auth: {
        redirectUrl: config.callbackURL,
        responseType: (config.internalOptions || {}).response_type ||
          (config.callbackOnLocationHash ? 'token' : 'code'),
        params: config.internalOptions
      },
      configurationBaseUrl: config.clientConfigurationBaseUrl,
      overrides: {
        __tenant: config.auth0Tenant,
        __token_issuer: config.authorizationServer.issuer
      },
      assetsUrl: config.assetsUrl,
      allowedConnections: connection ? [connection] : null,
      rememberLastLogin: !prompt,
      language: language,
      languageBaseUrl: config.languageBaseUrl,
      languageDictionary: languageDictionary,
      // Render inline in the page instead of the floating modal overlay.
      container: 'lock-container',
      theme: {
        primaryColor: colors.primary ? colors.primary : '#7b5cf5'
      },
      prefill: loginHint ? { email: loginHint, username: loginHint } : null,
      closable: false,
      defaultADUsernameFromEmailPrefix: false
    });

    lock.show();
  </script>
</body>
</html>
