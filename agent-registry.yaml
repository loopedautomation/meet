# Agents available to invite into meetings.
# Baked into the agent-bridge image at build time; each `brain` points at a running
# looped-af agent's TTY trigger (or webhook).
agents:
  - id: scout
    name: Scout
    description: A general-purpose research assistant that can look things up mid-meeting.
    greeting: "Hi, I'm Scout. Let me know if you need anything."
    # Speak only when addressed by name or called on — open floor made her
    # jump in on conversations that weren't for her. The host can still
    # loosen this mid-call from the agent panel.
    turn_policy: on-mention
    # "quiet" is also the schema default; explicit so it's easy to find.
    chattiness: quiet
    brain:
      kind: tty
      url: ws://demo-agent:8300/tty
      token_env: SCOUT_TTY_TOKEN
    # OpenAI realtime speech-to-speech, on the full model — the mini
    # default was too chatty and too quick to grab the floor. Voice and
    # mode can still be overridden at invite time.
    realtime:
      provider: openai
      model: gpt-realtime

  - id: echo
    name: Echo
    description: Scout's realtime twin — same brain, speaks over Gemini Live.
    greeting: "Echo here. What do you need?"
    # Default to a realtime speech-to-speech presence on Gemini Live
    # (model/voice fall back to the schema defaults: native-audio + Puck).
    realtime:
      provider: gemini
    brain:
      kind: tty
      url: ws://demo-agent:8300/tty
      token_env: SCOUT_TTY_TOKEN

